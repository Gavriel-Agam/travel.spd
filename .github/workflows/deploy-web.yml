# Tests the app, builds the web version and publishes it to GitHub Pages
# (branch gh-pages) on every push to main. Site: https://gavriel-agam.github.io/travel.spd/
name: Deploy web app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-web
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm test

      - name: Database tests (all migrations on an in-process Postgres)
        run: npm run test:sql

      - name: Build web app
        run: npx expo export --platform web --output-dir dist

      # Deep links (e.g. /travel.spd/expenses) must load the app, not a 404 page
      - run: cp dist/index.html dist/404.html

      - name: Publish to gh-pages
        run: |
          cd dist
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
