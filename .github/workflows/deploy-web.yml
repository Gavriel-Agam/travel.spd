# Tests the app, builds the web version and publishes it to GitHub Pages
# (branch gh-pages) on every push to main. Site: https://gavriel-agam.github.io/travel.spd/
name: Deploy web app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-web
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Reminder only (never blocks the deploy): data-related changes should
      # update the Privacy Policy / Terms pages. See CLAUDE.md.
      - name: Legal pages check
        if: github.event_name == 'push'
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then exit 0; fi
          git fetch -q --depth=1 origin "$BEFORE" || exit 0
          changed=$(git diff --name-only "$BEFORE" "$GITHUB_SHA")
          sensitive=$(echo "$changed" | grep -E '^(supabase/migrations/|supabase/functions/|package\.json$|src/lib/auth\.ts$|src/providers/AuthProvider\.tsx$|app/sign-in\.tsx$)' || true)
          legal=$(echo "$changed" | grep -E '^public/(privacy|terms)\.html$' || true)
          if [ -n "$sensitive" ] && [ -z "$legal" ]; then
            echo "::warning title=Check privacy/terms pages::Data-related files changed without updating public/privacy.html or public/terms.html: $(echo $sensitive | tr '\n' ' ')"
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm test

      - name: Database tests (all migrations on an in-process Postgres)
        run: npm run test:sql

      - name: Build web app
        run: npx expo export --platform web --output-dir dist

      # Deep links (e.g. /travel.spd/expenses) must load the app, not a 404 page
      - run: cp dist/index.html dist/404.html

      - name: Publish to gh-pages
        run: |
          cd dist
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
