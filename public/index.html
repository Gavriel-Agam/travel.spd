<!doctype html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>%WEB_TITLE%</title>

    <!-- Home-screen app (iPhone: Safari > Share > Add to Home Screen) -->
    <link rel="manifest" href="/travel.spd/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/travel.spd/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="SmartTrip" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="theme-color" content="#F4F5F9" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0E1020" media="(prefers-color-scheme: dark)" />
    <meta name="format-detection" content="telephone=no" />
    <script>
      // Light or dark mode chosen in the app (src/theme.ts): the page starts in it
      try {
        var chosenMode = localStorage.getItem('smarttrip-theme');
        if (chosenMode === 'dark' || chosenMode === 'light') {
          document.documentElement.setAttribute('data-theme', chosenMode);
        }
      } catch (e) {}
    </script>

    <style id="expo-reset">
      html,
      body {
        height: 100%;
        background: #f4f5f9;
      }
      @media (prefers-color-scheme: dark) {
        html,
        body {
          background: #0e1020;
        }
      }
      html[data-theme='light'],
      html[data-theme='light'] body {
        background: #f4f5f9;
        color-scheme: light;
      }
      html[data-theme='dark'],
      html[data-theme='dark'] body {
        background: #0e1020;
        color-scheme: dark;
      }
      body {
        overflow: hidden;
        /* No rubber-band scrolling of the whole page or long-press text selection on buttons */
        overscroll-behavior: none;
        -webkit-tap-highlight-color: transparent;
        -webkit-text-size-adjust: 100%;
      }
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
  </head>

  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <script>
      // Start-up guard: if a new version can't start (an old cached file, or data
      // saved by an older version it can't read), the page would stay blank. When
      // the app hasn't started, or an error leaves the screen empty, repair this
      // device's copy and reload: 1st time the stored app files, the saved Home
      // picture and the saved trip data (all downloaded again); 2nd time also the
      // display settings. Expenses waiting to sync and the sign-in are kept. If it
      // still fails, a message offers a full reset. The app sets __appStarted.
      (function () {
        var TRIES = 'smarttrip-boot-repair';
        var root = function () { return document.getElementById('root'); };
        var empty = function () { var r = root(); return !r || (!r.childElementCount && !r.textContent.trim()); };
        function tries() { try { return +(sessionStorage.getItem(TRIES) || 0); } catch (e) { return 9; } }
        function drop(keys) { keys.forEach(function (k) { try { localStorage.removeItem(k); } catch (e) {} }); }
        function wipeFiles() {
          var p = [];
          if (window.caches) p.push(caches.keys().then(function (ks) { return Promise.all(ks.map(function (k) { return caches.delete(k); })); }));
          if (navigator.serviceWorker) p.push(navigator.serviceWorker.getRegistrations().then(function (rs) { return Promise.all(rs.map(function (r) { return r.unregister(); })); }));
          return Promise.all(p).catch(function () {});
        }
        function help() {
          var he = (navigator.language || '').indexOf('he') === 0 || /"lang":"he"/.test(localStorage.getItem('travelspend-prefs') || '');
          var r = root();
          if (!r) return;
          r.innerHTML =
            '<div dir="' + (he ? 'rtl' : 'ltr') + '" style="margin:auto;max-width:340px;padding:32px;text-align:center;font-family:system-ui,sans-serif;color:#F2F3F8">' +
            '<div style="font-size:44px">⚠️</div><p style="font-size:18px;font-weight:700">' + (he ? 'האפליקציה לא נפתחה' : "The app didn't open") + '</p>' +
            '<p style="color:#A0A4BA;font-size:14px">' + (he ? 'איפוס מוחק את העותק במכשיר הזה. הוצאות שעוד לא סונכרנו יימחקו. הנתונים בחשבון נשמרים.' : 'Resetting clears this device’s copy. Expenses not yet synced will be lost. Your account data is kept.') + '</p>' +
            '<button id="boot-retry" style="width:100%;padding:14px;border:0;border-radius:14px;background:#3366FF;color:#fff;font-weight:700;font-size:16px;margin-top:8px">' + (he ? 'לנסות שוב' : 'Try again') + '</button>' +
            '<button id="boot-reset" style="width:100%;padding:14px;border:0;border-radius:14px;background:#2A2D45;color:#F2F3F8;font-weight:700;font-size:16px;margin-top:10px">' + (he ? 'איפוס ופתיחה מחדש' : 'Reset and reopen') + '</button></div>';
          document.body.style.background = '#0E1020';
          document.getElementById('boot-retry').onclick = function () { location.reload(); };
          document.getElementById('boot-reset').onclick = function () {
            try { localStorage.clear(); sessionStorage.clear(); } catch (e) {}
            wipeFiles().then(function () { location.reload(); });
          };
        }
        var repairing = false;
        function repair(reason) {
          if (window.__appStarted && !empty()) return;
          if (repairing) return;
          var n = tries();
          if (n >= 2) return help();
          repairing = true;
          try { sessionStorage.setItem(TRIES, String(n + 1)); localStorage.setItem('smarttrip-repaired', reason); } catch (e) {}
          drop(['smarttrip-launch', 'travelspend-cache']);
          if (n >= 1) drop(['travelspend-prefs']);
          wipeFiles().then(function () { location.reload(); });
        }
        // Opened from the offline copy: the app starts in a second or two, so a long wait means it's stuck
        var fromCache = function () { return !!(navigator.serviceWorker && navigator.serviceWorker.controller); };
        function onError(e) {
          if (!window.__appStarted && !fromCache()) return;
          var why = String((e && (e.message || (e.reason && e.reason.message) || e.reason)) || 'error').slice(0, 120);
          // React empties the page when drawing crashes; give it a moment
          setTimeout(function () { if (empty()) repair(why); }, 1500);
        }
        window.addEventListener('error', onError);
        window.addEventListener('unhandledrejection', onError);
        // Never started at all (e.g. the app's file failed to load)
        setTimeout(function () { if (!window.__appStarted && fromCache()) repair('no-start'); }, 20000);
        window.__appStartedOk = function () {
          try { sessionStorage.removeItem(TRIES); } catch (e) {}
        };
      })();
    </script>
    <script>
      // Instant launch (src/lib/launchSnapshot.ts): the Home screen as it was last
      // shown goes on screen right away; the app replaces it with the live one
      // as soon as it has started. Only on Home, only while still signed in.
      (function () {
        try {
          if (location.pathname !== '/travel.spd/') return;
          var s = JSON.parse(localStorage.getItem('smarttrip-launch') || 'null');
          if (!s || s.v !== 1 || !s.html) return;
          if (Date.now() - s.at > 30 * 864e5) return localStorage.removeItem('smarttrip-launch');
          if (!s.session || !localStorage.getItem(s.session)) return;
          var mode = localStorage.getItem('smarttrip-theme');
          var isDark = mode ? mode === 'dark' : !!(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark !== s.dark) return;
          if (s.w !== window.innerWidth || Math.abs(s.h - window.innerHeight) > 120) return;
          var css = document.createElement('style');
          css.id = 'launch-snapshot-css';
          css.textContent = s.css;
          document.head.appendChild(css);
          if (s.dir) document.documentElement.dir = s.dir;
          if (s.lang) document.documentElement.lang = s.lang;
          document.getElementById('root').innerHTML = s.html;
        } catch (e) {}
      })();
    </script>
    <script>
      // Offline support (public/sw.js): the app opens from the cache at once, with
      // or without signal. When a newer version has been downloaded in the
      // background, the app offers to reload (src/lib/appUpdate.ts).
      if ('serviceWorker' in navigator && location.hostname !== 'localhost') {
        navigator.serviceWorker.addEventListener('message', function (e) {
          if (e.data && e.data.type === 'APP_UPDATED') {
            window.__appUpdateReady = true;
            window.dispatchEvent(new Event('app-update-ready'));
          }
        });
        window.addEventListener('load', function () {
          navigator.serviceWorker.register('/travel.spd/sw.js', { scope: '/travel.spd/' }).catch(function () {});
        });
      }
    </script>
  </body>
</html>
