# Minimal Supabase CLI config. `npx supabase link` fills in the project ref.
project_id = "travelspend-couple"

[auth]
site_url = "https://gavriel-agam.github.io/travel.spd/"
additional_redirect_urls = ["https://gavriel-agam.github.io/travel.spd/**", "travelspend://**", "exp://**"]
# TEMPORARILY open (2026-11-03) until the second partner's account exists;
# set back to false and run `supabase config push --yes` afterwards
enable_signup = true

[auth.email]
enabled = true
# The app signs in with a 6-digit code: the email template must include {{ .Token }}
otp_length = 6
otp_expiry = 3600

[functions.fx-rates]
verify_jwt = true
