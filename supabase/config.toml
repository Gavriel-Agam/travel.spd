# Minimal Supabase CLI config. `npx supabase link` fills in the project ref.
project_id = "travelspend-couple"

[auth]
site_url = "https://gavriel-agam.github.io/travel.spd/"
additional_redirect_urls = [
  "https://gavriel-agam.github.io/travel.spd/**",
  "http://localhost:8081/**",
  # Local QA environment (scripts/qa-local.mjs)
  "http://localhost:8082/**",
  "travelspend://**",
  "exp://**",
]
# Real accounts: email + password and Google (Google is configured in the
# dashboard, so its secret never lives in this repo). Anonymous sign-in was the
# no-login MVP; existing anonymous phones move to an account with
# start/finish_account_transfer.
enable_signup = true
enable_anonymous_sign_ins = false
minimum_password_length = 8

[auth.email]
enabled = true
# No confirmation email: a new account can sign in immediately (no codes)
enable_confirmations = false
otp_length = 6
otp_expiry = 3600

[functions.fx-rates]
verify_jwt = true
