# Minimal Supabase CLI config. `npx supabase link` fills in the project ref.
# Names the local Docker stack (containers and data volumes: supabase_db_travelspend-couple, ...).
# Keep it: a different name makes the CLI look for other containers and start a new, empty
# local database (scripts/qa-local.mjs). It has no effect on the live project (linked by ref).
project_id = "travelspend-couple"

[auth]
site_url = "https://gavriel-agam.github.io/travel.spd/"
additional_redirect_urls = [
  "https://gavriel-agam.github.io/travel.spd/**",
  "http://localhost:8081/**",
  # Local QA environment (scripts/qa-local.mjs)
  "http://localhost:8082/**",
  "travelspend://**",
  "exp://**",
]
# Real accounts: email + password and Google (Google is configured in the
# dashboard, so its secret never lives in this repo). Anonymous sign-in was the
# no-login MVP; existing anonymous phones move to an account with
# start/finish_account_transfer.
enable_signup = true
enable_anonymous_sign_ins = false
minimum_password_length = 8

[auth.email]
enabled = true
# No confirmation email: a new account can sign in immediately (no codes)
enable_confirmations = false
otp_length = 6
otp_expiry = 3600

# Passkeys (Face ID / fingerprint), Supabase beta. These values are for the local
# QA stack; the live project sets its own in the dashboard (Authentication >
# Passkeys) with RP ID gavriel-agam.github.io. Changing the live RP ID makes every
# saved passkey stop working.
[auth.passkey]
enabled = true

[auth.webauthn]
rp_display_name = "SmartTrip"
rp_id = "localhost"
rp_origins = ["http://localhost:8082"]

[functions.fx-rates]
verify_jwt = true

[functions.smart-parse-expenses]
verify_jwt = true

# Local QA stack only (scripts/qa-local.mjs): skip the services the app does not
# use, so `supabase start` downloads and runs less. No effect on the live project.
[studio]
enabled = false

[analytics]
enabled = false
