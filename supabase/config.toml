# Minimal Supabase CLI config. `npx supabase link` fills in the project ref.
project_id = "travelspend-couple"

[auth]
site_url = "https://gavriel-agam.github.io/travel.spd/"
additional_redirect_urls = ["https://gavriel-agam.github.io/travel.spd/**", "travelspend://**", "exp://**"]
# MVP without login: each device signs in anonymously and joins the shared
# trip (join_shared_trip). Anonymous sign-in needs sign-ups enabled.
enable_signup = true
enable_anonymous_sign_ins = true

[auth.email]
enabled = true
otp_length = 6
otp_expiry = 3600

[functions.fx-rates]
verify_jwt = true
